name: Create repository

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: "Repository name (lowercase letters, numbers, - . _)"
        required: true
        type: string
      description:
        description: "Short description"
        required: false
        type: string

permissions: {}

jobs:
  create:
    runs-on: ubuntu-latest
    environment: repo-creation
    env:
      ORG: ${{ github.repository_owner }}
      # Teams allowed to run this. What each gets on the new repo is set in 'Grant team access'.
      CREATOR_TEAMS: "boosted_developers boosted_marketing"
    steps:
      - name: Get app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REPO_CREATOR_APP_ID }}
          private-key: ${{ secrets.REPO_CREATOR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check requester is on a creator team
        id: teams
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ACTOR: ${{ github.actor }}
        run: |
          matched=""
          for team in $CREATOR_TEAMS; do
            state=$(gh api "orgs/$ORG/teams/$team/memberships/$ACTOR" --jq .state 2>/dev/null || true)
            if [ "$state" = "active" ]; then
              matched="$matched $team"
            fi
          done
          if [ -z "$matched" ]; then
            echo "::error::$ACTOR is not an active member of any of: $CREATOR_TEAMS"
            exit 1
          fi
          echo "matched=$matched" >> "$GITHUB_OUTPUT"

      - name: Validate name
        env:
          NAME: ${{ inputs.repo_name }}
        run: |
          if ! [[ "$NAME" =~ ^[a-z0-9][a-z0-9._-]{0,99}$ ]]; then
            echo "::error::Invalid repo name: $NAME"
            exit 1
          fi

      - name: Create repository
        id: create
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NAME: ${{ inputs.repo_name }}
          DESC: ${{ inputs.description }}
        run: |
          repo_id=$(gh api -X POST "orgs/$ORG/repos" \
            -f name="$NAME" \
            -f description="$DESC" \
            -f visibility=private \
            -F auto_init=true \
            --jq .id)
          echo "repo_id=$repo_id" >> "$GITHUB_OUTPUT"

      - name: Grant team access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NAME: ${{ inputs.repo_name }}
          TEAMS: ${{ steps.teams.outputs.matched }}
        run: |
          grant() {
            gh api --silent -X PUT "orgs/$ORG/teams/$1/repos/$ORG/$NAME" -f permission="$2"
            echo "Granted $1 $2 on $NAME"
          }
          # Access depends on which creator team the requester is in
          for team in $TEAMS; do
            case "$team" in
              boosted_marketing)
                grant boosted_marketing push
                ;;
              boosted_developers)
                grant boosted_developers push
                grant boosted pull
                ;;
            esac
          done

      - name: Add repo to developers runner group
        if: contains(steps.teams.outputs.matched, 'boosted_developers')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NAME: ${{ inputs.repo_name }}
          REPO_ID: ${{ steps.create.outputs.repo_id }}
          GROUP: runners-boosted_developers
        run: |
          gid=$(gh api --paginate "orgs/$ORG/actions/runner-groups" \
            --jq ".runner_groups[] | select(.name == \"$GROUP\") | .id")
          if [ -z "$gid" ]; then
            echo "::warning::Runner group $GROUP not found; $NAME not added"
            exit 0
          fi
          gh api --silent -X PUT "orgs/$ORG/actions/runner-groups/$gid/repositories/$REPO_ID"
          echo "Added $NAME to $GROUP"
